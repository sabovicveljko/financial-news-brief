[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-financial-news-brief"
version = "0.1.0"
description = "A daily financial and macroeconomic news brief sent to Telegram"
requires-python = ">=3.12"
dependencies = ["truststore==0.10.5"]

[tool.setuptools.packages.find]
where = ["src"]